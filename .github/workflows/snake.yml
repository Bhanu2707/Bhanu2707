name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"      # rebuilds daily
  workflow_dispatch:          # allows manual runs
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2338BDF8&color_dots=%231E293B,%231E293B,%23334155,%2338BDF8,%238B5CF6

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
