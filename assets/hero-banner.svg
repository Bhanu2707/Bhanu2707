<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="900" height="180" fill="#0F172A"/>
  <rect width="900" height="180" fill="url(#lineGrad)" opacity="0.03"/>

  <!-- connections -->
  <g stroke="url(#lineGrad)" stroke-width="1.4" fill="none" opacity="0.65">
    <path d="M80,90 L220,50" stroke-dasharray="146" stroke-dashoffset="146">
      <animate attributeName="stroke-dashoffset" values="146;0;0;146" keyTimes="0;0.35;0.75;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M80,90 L220,130" stroke-dasharray="146" stroke-dashoffset="146">
      <animate attributeName="stroke-dashoffset" values="146;0;0;146" keyTimes="0;0.35;0.75;1" dur="7s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M220,50 L380,90" stroke-dasharray="165" stroke-dashoffset="165">
      <animate attributeName="stroke-dashoffset" values="165;0;0;165" keyTimes="0;0.35;0.75;1" dur="7s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M220,130 L380,90" stroke-dasharray="165" stroke-dashoffset="165">
      <animate attributeName="stroke-dashoffset" values="165;0;0;165" keyTimes="0;0.35;0.75;1" dur="7s" begin="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M380,90 L520,40" stroke-dasharray="149" stroke-dashoffset="149">
      <animate attributeName="stroke-dashoffset" values="149;0;0;149" keyTimes="0;0.35;0.75;1" dur="7s" begin="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M380,90 L520,140" stroke-dasharray="149" stroke-dashoffset="149">
      <animate attributeName="stroke-dashoffset" values="149;0;0;149" keyTimes="0;0.35;0.75;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M520,40 L680,90" stroke-dasharray="168" stroke-dashoffset="168">
      <animate attributeName="stroke-dashoffset" values="168;0;0;168" keyTimes="0;0.35;0.75;1" dur="7s" begin="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M520,140 L680,90" stroke-dasharray="168" stroke-dashoffset="168">
      <animate attributeName="stroke-dashoffset" values="168;0;0;168" keyTimes="0;0.35;0.75;1" dur="7s" begin="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M680,90 L820,90" stroke-dasharray="140" stroke-dashoffset="140">
      <animate attributeName="stroke-dashoffset" values="140;0;0;140" keyTimes="0;0.35;0.75;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- node glows -->
  <g filter="url(#softBlur)">
    <circle cx="80" cy="90" r="14" fill="url(#nodeGlow)"/>
    <circle cx="220" cy="50" r="14" fill="url(#nodeGlow)"/>
    <circle cx="220" cy="130" r="14" fill="url(#nodeGlow)"/>
    <circle cx="380" cy="90" r="16" fill="url(#nodeGlow)"/>
    <circle cx="520" cy="40" r="14" fill="url(#nodeGlow)"/>
    <circle cx="520" cy="140" r="14" fill="url(#nodeGlow)"/>
    <circle cx="680" cy="90" r="16" fill="url(#nodeGlow)"/>
    <circle cx="820" cy="90" r="14" fill="url(#nodeGlow)"/>
  </g>

  <!-- node cores -->
  <g fill="#E2E8F0">
    <circle cx="80" cy="90" r="4.5">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="50" r="4.5">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="130" r="4.5">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="90" r="5.5">
      <animate attributeName="r" values="5.5;7.5;5.5" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="40" r="4.5">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="140" r="4.5">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="90" r="5.5">
      <animate attributeName="r" values="5.5;7.5;5.5" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="90" r="4.5">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="2.4s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
